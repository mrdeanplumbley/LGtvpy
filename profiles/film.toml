# Best picture quality for film / TV in a dim room.
# Apply with:  lgtv profile apply profiles/film.toml
#
# Filmmaker mode is the most accurate preset (no motion smoothing, correct
# colour). Tweak the numbers to taste, then re-apply. See docs/SETTINGS.md
# for every available key and value.

name = "Film — cinematic"
description = "Accurate Filmmaker mode, warm and film-like, motion smoothing off."

# input = "HDMI_1"     # uncomment to also switch input (e.g. your Blu-ray/AppleTV)
volume = 14

[picture]
pictureMode = "filmMaker"   # most accurate; try "cinema" if unavailable
backlight = 60              # OLED light 0-100 (dim room; raise for bright rooms)
contrast = 85
brightness = 50            # black level - 50 is reference
color = 50
sharpness = 0              # 0 = no artificial sharpening (most film-accurate)
energySaving = "off"       # stop the TV auto-dimming the panel

[sound]
soundMode = "movie"
