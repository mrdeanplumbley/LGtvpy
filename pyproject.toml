[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LGtvpy"
version = "1.0.0"
description = "Control LG webOS TVs (C-series OLED etc.) from your PC over the local network"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["websocket-client>=1.6"]

[project.scripts]
lgtv = "lgtvpy.cli:main"

[tool.setuptools]
packages = ["lgtvpy"]
