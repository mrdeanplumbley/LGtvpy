[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LGtvpy"
version = "1.0.0"
description = "Control LG webOS TVs (C-series OLED etc.) from your PC over the local network"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "websocket-client>=1.6",
    "tomli>=1.1; python_version < '3.11'",  # tomllib is stdlib from 3.11
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lgtv = "lgtvpy.cli:main"

[tool.setuptools]
packages = ["lgtvpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real paired TV over the network (set LGTV_LIVE=1 and run pytest -m live)",
]
